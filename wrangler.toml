name = "dezignmail"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ─── Environment Variables ────────────────────────────────────────────────────
[vars]
ALLOWED_DOMAINS     = "healthtek.eu.cc,dezignmail.eu.cc,dezignwisemail.eu.cc"
HOURS_TO_DELETE     = 3
TELEGRAM_LOG_ENABLE = false

# ─── Cloudflare D1 (SQLite email store) ──────────────────────────────────────
[[d1_databases]]
binding       = "D1"
database_name = "dezignmail-d1"
database_id   = "feedd209-0483-448c-b78c-7af3f46abf64"

# ─── Cloudflare R2 (attachment storage) ──────────────────────────────────────
[[r2_buckets]]
binding     = "R2"
bucket_name = "dezignmail-attachments"
